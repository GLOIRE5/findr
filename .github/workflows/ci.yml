name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

# A new push to the same branch cancels the run that is still going
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Lint and test (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      # Finish both apps even if one fails, so we see every problem at once
      fail-fast: false
      matrix:
        include:
          - app: backend
            check: test
          - app: frontend
            check: build
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Backend runs the Jest tests and also writes the results to a file.
      # Frontend checks that the website builds.
      - name: Run ${{ matrix.check }}
        run: npm run ${{ matrix.check }}${{ matrix.app == 'backend' && ' -- --json --outputFile=test-results.json' || '' }}

      # Keep the test results, even when the tests fail, so we can read them
      - name: Upload backend test results
        if: always() && matrix.app == 'backend'
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results.json
          if-no-files-found: ignore

      # Keep the built website so every version can be downloaded and checked
      - name: Upload frontend build
        if: matrix.app == 'frontend'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: frontend/dist
          if-no-files-found: error

  docker:
    name: Docker build
    # Only build the image once the code passes lint and tests
    needs: lint-and-test
    runs-on: ubuntu-latest
    # packages: write lets this job publish to GitHub Container Registry
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Reuse unchanged layers from earlier runs (GitHub Actions cache)
      - name: Build the image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: findr:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Start the container without a database (it falls back to memory)
      # and wait for /api/health to answer
      - name: Check the container starts
        run: |
          docker run -d --name findr -p 3000:3000 findr:ci
          for i in $(seq 1 15); do
            curl -fs http://localhost:3000/api/health && exit 0
            sleep 2
          done
          docker logs findr
          exit 1

      # Image names must be lowercase
      - name: Work out the image name
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Log in with the token GitHub gives every run. No passwords in the code.
      - name: Log in to GitHub Container Registry
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Only pull requests into main publish an image, tagged with the commit SHA.
      # It runs after the container check, so only an image that starts gets pushed.
      - name: Push the image
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.event.pull_request.head.sha }}
          cache-from: type=gha