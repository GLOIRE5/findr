# Start everything: docker compose up
# Then open http://localhost:3000
# To change the settings, copy .env.example to .env

name: findr

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: findr-app
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      # "db" = the database service below
      MONGODB_URI: mongodb://${MONGO_USER:-findr}:${MONGO_PASSWORD:-findr-local}@db:27017/${MONGO_DB:-findr}?authSource=admin
      # the website is served by the app; 5173 is for npm run dev
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:5173}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - findr-net

  db:
    image: mongo:7.0
    environment:
      # default login is for local use only, set your own in .env
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-findr}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-findr-local}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    networks:
      - findr-net

volumes:
  # remove with: docker compose down -v
  mongo-data:

networks:
  findr-net:
    driver: bridge
